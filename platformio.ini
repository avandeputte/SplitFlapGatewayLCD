; ============================================================================
;  LCD Gateway -- PlatformIO project
;  Target: Waveshare ESP32-P4-WIFI6-POE-ETH + Waveshare 10.1" DSI touch display
;          (800x1280 portrait panel, mounted landscape 1280x800)
;
;  Forked from MatrixPortalGateway v3.16.0. Board facts that drive the settings:
;    * ESP32-P4 ECO2 (pre-rev-3;00 silicon, ROM "esp32p4-eco2"): dual RISC-V @ 360 MHz, NO radio -- WiFi 6 / BLE via
;      the onboard ESP32-C6 over SDIO (esp_hosted; Arduino WiFi API is remoted).
;    * 32 MB NOR flash + 32 MB in-package PSRAM.
;    * MIPI-DSI 2-lane to the 10.1" panel; ES8311 codec + NS4150B amp + SMD mic;
;      IP101 Ethernet PHY with PoE; SDIO 3.0 TF slot; USB OTG HS.
;    * No PCF85063 RTC and no IMU (unlike the Matrix boards): NTP-only clock,
;      no tap gestures -- the touch panel replaces them (GT-series I2C touch).
;    * Console is USB-Serial-JTAG (no ARDUINO_USB_CDC_ON_BOOT dance).
;
;  Build:   pio run
;  Upload:  pio run -t upload
;  Monitor: pio device monitor
;
;  WARNING: `pio pkg install` REWRITES this file -- it strips every comment.
;  Let `pio run` resolve lib_deps, and edit lib_deps by hand.
; ============================================================================

[platformio]
; Default build target. `pio run` (no -e) builds only this env -- the shipping 10.1" board.
; Build the 7B board explicitly with `-e waveshare_p4_lcd_7b` once its env is enabled (Phase 2).
default_envs = waveshare_p4_lcd

; ---- the shipping board: Waveshare ESP32-P4-WIFI6-POE-ETH + 10.1" JD9365 DSI panel ----
[env:waveshare_p4_lcd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-p4
framework = arduino

board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions-32MB.csv
board_build.filesystem = fatfs

; The companion-crash fix (the P4 cousin of the Matrix v3.3.0 lesson): a canvas
; frame flooding in over WiFi piled 64KB-per-socket TCP windows of ~1.5KB pbufs
; into INTERNAL heap (SPIRAM_MALLOC_ALWAYSINTERNAL=4096 sent them all there),
; starving esp-hosted's SDIO rx buffers, which are DMA/internal by necessity --
; and its driver ASSERTS on empty pool (sdio_drv.c:953) instead of dropping.
; Structural fix: small-alloc threshold down to 512 so pbufs live in PSRAM (hex,
; 200 MHz -- fast), a 32KB internal reserve malloc may not eat, lwIP preferring
; PSRAM where honoured, and a halved TCP window to bound the flood per socket.
custom_sdkconfig =
    ; Flash-write display glitch: ROOT CAUSE (source-verified, 2026-08). The DSI scan-out
    ; is NOT hardware-autonomous: the driver's DW-GDMA link list is ONE descriptor with
    ; is_last=true, so the channel self-disables after EVERY frame and the DW-GDMA
    ; trans-done ISR must re-arm it (esp_lcd_panel_dpi.c mipi_dsi_dma_trans_done_cb).
    ; A flash erase masks non-IRAM interrupts on BOTH cores for 30-400 ms (2-24 frames);
    ; without the option below that re-arm ISR is non-IRAM, so the channel sat dead and
    ; the RAM-less JD9365 showed undriven-pixel garbage (bright on dark content) until
    ; the pended IRQ finally re-armed it. LCD_DSI_ISR_CACHE_SAFE is Espressif's option
    ; for exactly this: it IRAM-flags the DSI bridge ISR and (via select
    ; DW_GDMA_ISR_IRAM_SAFE + DW_GDMA_OBJ_DRAM_SAFE) the DW-GDMA re-arm ISR, so panel
    ; refresh continues straight through flash ops. After ANY build, verify all three
    ; resolved =y in the generated core sdkconfig -- the resolver drops the option
    ; SILENTLY when its prompt is hidden.
    ; DO NOT ADD CONFIG_SPI_FLASH_AUTO_SUSPEND: (a) this GD25Q256 (0xC84019) has no
    ; CAP_SUSPEND so it can never engage (force-whitelisting it corrupts the scan-out
    ; fetch mid-frame -- the solid-blue wedge), and (b) merely SETTING it hides the
    ; CACHE_SAFE prompt and the resolver silently drops the real fix.
    ; (Other dead ends: L2 512 KB eats internal SRAM, link fails; XIP-from-PSRAM needs
    ; SPIRAM_BOOT_HW_INIT which this Arduino core keeps off; DPI clock changes moot.)
    CONFIG_LCD_DSI_ISR_CACHE_SAFE=y
    CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=y
    CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=512
    CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL=32768
    CONFIG_LWIP_TCP_WND_DEFAULT=32768
    ; Not tuning: the bundled esp-modbus (unused here) has hybrid-recompile
    ; defaults that violate its own static assert; these satisfy it. Same quirk,
    ; same lines as the Matrix Gateway's custom core.
    CONFIG_FMB_MASTER_TIMEOUT_MS_RESPOND=150
    CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=1000

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_P4_LCD_10=1
    -DBOARD_HAS_PSRAM
    ; --- microSD (TF slot): SDMMC SLOT 0 on its fixed IOMUX pins (43/44/39-42),
    ; powered by the P4's on-chip LDO channel 4. Crucial: the C6 WiFi radio
    ; (esp_hosted) occupies SDMMC SLOT 1, and without BOARD_SDMMC_SLOT=0 the
    ; Arduino SD_MMC library hardcodes host.slot = SLOT 1 -- the mount collides
    ; with the radio and always fails (the long-standing "SD never mounts" bug).
    ; These must be visible where the core's SD_MMC.cpp compiles, hence
    ; build_flags not build_src_flags (same reason as the ETH pins above).
    -DBOARD_HAS_SDMMC
    -DBOARD_SDMMC_SLOT=0
    -DBOARD_SDMMC_POWER_CHANNEL=4
    ; ESP32-P4 RMII data pins for the Arduino ETH library (IP101 PHY, IDF default
    ; wiring -- confirmed against Waveshare's own ethernetbasic example). These must
    ; be defined where ETH.cpp compiles, hence build_flags not build_src_flags.
    -DETH_RMII_CLK=50
    -DETH_RMII_TX_EN=49
    -DETH_RMII_TX0=34
    -DETH_RMII_TX1=35
    -DETH_RMII_CRS_DV=28
    -DETH_RMII_RX0=29
    -DETH_RMII_RX1_EN=30

build_src_flags =
    -Wall
    -Wunused-function

; This board drives the JD9365 panel -- compile ONLY its vendored driver, not the EK79007
; one (the 7B env below flips this). Each board's binary carries only its own panel driver.
build_src_filter = +<*> -<esp_lcd_ek79007.c>

upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

lib_ldf_mode = chain
lib_deps =
    bblanchon/ArduinoJson @ ^7
    bitbank2/AnimatedGIF @ ^2.2.0

; ============================================================================
;  The 7B board: Waveshare ESP32-P4-WIFI6-Touch-LCD-7B + 7" EK79007 1024x600 DSI panel.
;  Phase 2 bring-up. Shares everything with the 10.1" env via `extends`; the deltas are the
;  board-select macro, NO Ethernet RMII pins (WiFi-only board), and the panel driver (each env
;  compiles ONLY its own vendored driver, via build_src_filter). The EK79007 driver is vendored
;  in src/, so there is no extra lib_deps. Build it with:  pio run -e waveshare_p4_lcd_7b
; ============================================================================
[env:waveshare_p4_lcd_7b]
extends = env:waveshare_p4_lcd
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_P4_LCD_7B=1
    -DBOARD_HAS_PSRAM
    -DBOARD_HAS_SDMMC
    -DBOARD_SDMMC_SLOT=0
    -DBOARD_SDMMC_POWER_CHANNEL=4
build_src_filter = +<*> -<esp_lcd_jd9365_10_1.c>
